<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocktail Generator</title>
  <link rel="stylesheet" href="./stylecocktail.css">
</head>
<body>
  <h1>Cocktail Generator</h1>

  <div class="container">
    <div class="tabs" role="tablist" aria-label="Cocktail sections">
      <button type="button" role="tab" id="tab-generate" aria-controls="panel-generate" aria-selected="true">Generate</button>
      <button type="button" role="tab" id="tab-add" aria-controls="panel-add" aria-selected="false" tabindex="-1">Add Cocktail</button>
    </div>

    <section id="panel-generate" role="tabpanel" aria-labelledby="tab-generate" tabindex="0">
      <div class="filters">
        <h2>Filter by:</h2>
        <ul>
          <li>
            <label for="spirit-types">Spirit Type:</label>
            <div id="spirit-types">
            </div>
          </li>
          <li>
            <label for="flavor-profiles">Flavor Profile:</label>
            <div id="flavor-profiles">
            </div>
          </li>
        </ul>
        <button id="generate-cocktail" type="button">Generate Cocktail</button>
      </div>

      <div id="cocktail-result">
        <h2>Your Cocktail</h2>
        <div id="cocktail-name"></div>
        <div id="cocktail-ingredients"></div>
        <div id="cocktail-instructions"></div>
        <img id="cocktail-image" src="" alt="" style="display: none;">
        <div id="cocktail-error" role="status"></div>
      </div>
    </section>

    <section id="panel-add" role="tabpanel" aria-labelledby="tab-add" tabindex="0" hidden>
      <h2>Add a Cocktail</h2>
      <form id="cocktail-form">
        <fieldset>
          <label for="new-name">Cocktail Name
            <input id="new-name" name="name" type="text" placeholder="give your cocktail a name" required>
          </label>
          <label for="new-spirit">Spirit Type
            <select id="new-spirit" name="spiritType" required>
              <option value="">choose a spirit</option>
            </select>
          </label>
          <label for="new-flavour">Flavor Profile
            <select id="new-flavour" name="flavorProfile" required>
              <option value="">choose a flavour profile</option>
            </select>
          </label>
          <label for="new-ingredients">Ingredients
            <textarea id="new-ingredients" name="ingredients" rows="4"
              placeholder="one per line, amount first&#10;e.g.&#10;60 ml Gin&#10;15 ml Lemon juice&#10;Lemon peel"></textarea>
          </label>
          <label for="new-instructions">Instructions
            <textarea id="new-instructions" name="instructions" rows="3"
              placeholder="how do you make it?"></textarea>
          </label>
          <button type="submit">Save Cocktail</button>
          <div id="form-error" role="alert"></div>
        </fieldset>
      </form>
    </section>
  </div>

  <script src="./tabs.js"></script>
  <script src="./cocktail-store.js"></script>
  <script src="./scriptcocktail.js"></script>
</body>
</html>
